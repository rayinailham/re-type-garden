<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><link rel="stylesheet" href="../assets/base.css" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/base.css" />
      <style>#s1 { position: absolute; inset: 0; }</style>
      <div id="s1" data-composition-id="s1" data-width="1080" data-height="1080">
        <div class="scene s1">
        <p class="kicker mono" id="s1-k">Reverse-engineering case study</p>
        <h1 class="serif" id="s1-h"><span class="re" id="s1-w1">RE:</span><span id="s1-w2">Type</span><span id="s1-w3">Garden</span></h1>
        <p class="sub mono" id="s1-sub">A <b>1:1</b> rebuild of Akshat Agarwal's Type Garden — same keystrokes, same garden.</p>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const E = "power3.out";
          tl.fromTo("#s1-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0.2);
          tl.fromTo(["#s1-w1", "#s1-w2", "#s1-w3"], { opacity: 0, y: 70, rotation: 4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.7, ease: "back.out(1.6)", stagger: 0.16 }, 0.4);
          tl.fromTo("#s1-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 1.3);
          tl.to(["#s1-k", "#s1-h", "#s1-sub"], { opacity: 0, y: -24, duration: 0.4, ease: "power2.in", stagger: 0.05 }, 4.0);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
