<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><link rel="stylesheet" href="../assets/base.css" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/base.css" />
      <style>#s4 { position: absolute; inset: 0; }</style>
      <div id="s4" data-composition-id="s4" data-width="1080" data-height="1080">
        <div class="scene s4">
        <p class="big serif" id="s4-big">1:1</p>
        <p class="bigsub serif" id="s4-bigsub">Pixel-identical poster engine.<small>original code run as an oracle · YIQ pixel diff · 1% threshold</small></p>
        <div class="stat" id="st1"><p class="n serif"><span id="n1">0</span>/49</p><p class="l mono">poster frames · 0.0000% diff</p><p class="s mono">7 presets × 3 moments × 2 seeds + boil</p></div>
        <div class="stat" id="st2"><p class="n serif"><span id="n2">0</span>/63</p><p class="l mono">unit tests passing</p><p class="s mono">engine · input · poster · export · live</p></div>
        <div class="stat" id="st3"><p class="n serif"><span id="n3">0</span>/27</p><p class="l mono">QA sweep checks clean</p><p class="s mono">Chromium · Firefox · WebKit × 3 viewports</p></div>
        <div class="stat" id="st4"><p class="n serif" id="n4">0</p><p class="l mono">leaked commercial assets</p><p class="s mono">no GT Ultra · no author keys · own glyphs.json</p></div>
        <p class="foot mono" id="s4-foot">Type mode is set in Playfair Display (SIL OFL) — the commercial GT Ultra is not redistributed.</p>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const E = "power3.out";
          // angka: showcase/out/{parity,unit,leak}.log + tests/e2e/out/qa/results.json
          tl.fromTo("#s4-big", { opacity: 0, scale: 0.8, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, 0.1);
          tl.fromTo("#s4-bigsub", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 0.4);
          tl.fromTo(["#st1", "#st2", "#st3", "#st4"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: E, stagger: 0.18 }, 0.9);
          const count = (id, to, at) => {
            const o = { v: 0 }, el = document.querySelector(id);
            tl.to(o, { v: to, duration: 1.4, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(o.v); } }, at);
          };
          count("#n1", 49, 1.0); count("#n2", 63, 1.2); count("#n3", 27, 1.4);
          tl.fromTo("#s4-foot", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.6);
          tl.to(["#s4-big", "#s4-bigsub", "#st1", "#st2", "#st3", "#st4", "#s4-foot"], { opacity: 0, duration: 0.35 }, 10.1);
          window.__timelines["s4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
