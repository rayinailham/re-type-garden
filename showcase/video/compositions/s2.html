<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><link rel="stylesheet" href="../assets/base.css" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/base.css" />
      <style>#s2 { position: absolute; inset: 0; }</style>
      <div id="s2" data-composition-id="s2" data-width="1080" data-height="1080">
        <div class="scene s2">
        <p class="head mono" id="s2-h">Type mode · same script, both builds</p>
        <p class="tag mono" id="s2-ta"><span class="dot" style="background:var(--mute)"></span>Original<i>type-garden.vercel.app · Akshat Agarwal</i></p>
        <div class="panel" id="s2-pa"><video id="v-type-orig" src="assets/type-orig.mp4" muted playsinline data-start="0" data-duration="13" data-media-start="0.5"></video></div>
        <p class="tag mono" id="s2-tb"><span class="dot" style="background:var(--rose)"></span>Rebuild<i>Next.js + TypeScript · Rayina Ilham</i></p>
        <div class="panel" id="s2-pb"><video id="v-type-rebuild" src="assets/type-rebuild.mp4" muted playsinline data-start="0" data-duration="13" data-media-start="0.5"></video></div>
        <div class="cap mono">
          <div id="c1"><b>type</b> → stems sprout, roses bloom</div>
          <div id="c2"><b>space</b> → the word is cut, its ends bloom</div>
          <div id="c3"><b>backspace</b> → letters wither</div>
          <div id="c4">same keystrokes · <b>same garden</b></div>
        </div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const E = "power3.out";
          tl.fromTo("#s2-h", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo(["#s2-pa", "#s2-pb"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: E, stagger: 0.12 }, 0.05);
          tl.fromTo(["#s2-ta", "#s2-tb"], { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: E, stagger: 0.12 }, 0.2);
          for (const [id, a, b] of [["#c1", 0.2, 4.2], ["#c2", 4.2, 8.3], ["#c3", 8.3, 10.1], ["#c4", 10.1, 12.6]]) {
            tl.fromTo(id, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: E }, a);
            tl.to(id, { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, b - 0.25);
          }
          tl.to(["#s2-pa", "#s2-pb", "#s2-ta", "#s2-tb", "#s2-h"], { opacity: 0, duration: 0.35 }, 12.6);
          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
